name: 'build-mom6'

description: >-
  Build one MOM6 variant with the selected build system and upload it as the
  mom6-<variant>-artifact that the verify-linux.yml and verify-macos.yml test
  jobs consume.

# Each build system has its own action (build-mom6-make, build-mom6-cmake). This
# action picks one and then packages the result, so the artifact contract below
# is defined once no matter which build system produced the executables. A
# step's `uses:` cannot be an expression, hence one gated step per build system.
#
# Artifact contract: every build system must leave its executables at these
# paths, because the test jobs unpack the tar at the repository root and run
# `make -C .testing -o build/<dir>/MOM6 test.*` against them.
#
#   variant      artifact                     contents
#   symmetric    mom6-symmetric-artifact      .testing/build/symmetric/MOM6
#   asymmetric   mom6-asymmetric-artifact     .testing/build/asymmetric/MOM6
#   repro        mom6-repro-artifact          .testing/build/repro/MOM6
#   openmp       mom6-openmp-artifact         .testing/build/openmp/MOM6
#   target       mom6-target-artifact         .testing/build/target/MOM6
#   opt          mom6-opt-artifact            .testing/build/opt/MOM6
#                                             .testing/build/timing/time_*
#   opt-target   mom6-opt-target-artifact     .testing/build/opt_target/MOM6
#                                             .testing/build/target_codebase/.testing/build/timing/time_*
#   coverage     mom6-coverage-artifact       .testing/build/cov/MOM6, .testing/build/cov/*.gcno
#                                             .testing/build/unit/test_*, .testing/build/unit/*.gcno
#   coupled-api  (none; a compile check only)

inputs:
  variant:
    description: 'symmetric, asymmetric, repro, openmp, target, opt, opt-target, coverage or coupled-api'
    required: true
  build-system:
    description: 'make (the .testing Makefile) or cmake'
    required: false
    default: 'make'

runs:
  using: 'composite'
  steps:
    - name: Check build system
      shell: bash
      env:
        BUILD_SYSTEM: ${{ inputs.build-system }}
      run: |
        case "$BUILD_SYSTEM" in
          make|cmake) ;;
          *) echo "::error::Unknown build-system '$BUILD_SYSTEM' (expected make or cmake)"; exit 1 ;;
        esac

    - if: inputs.build-system == 'make'
      uses: ./.github/actions/build-mom6-make
      with:
        variant: ${{ inputs.variant }}

    - if: inputs.build-system == 'cmake'
      uses: ./.github/actions/build-mom6-cmake
      with:
        variant: ${{ inputs.variant }}

    - name: Prepare artifact
      if: inputs.variant != 'coupled-api'
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
      run: |
        case "$VARIANT" in
          symmetric|asymmetric|repro|openmp|target)
            tar -cf mom6-$VARIANT.tar .testing/build/$VARIANT/MOM6
            ;;
          opt)
            tar -cf mom6-opt.tar \
            --exclude='.testing/build/timing/time_*.o' \
            .testing/build/opt/MOM6 \
            .testing/build/timing/time_*
            ;;
          opt-target)
            tar -cf mom6-opt-target.tar \
            --exclude='.testing/build/target_codebase/.testing/build/timing/time_*.o' \
            .testing/build/opt_target/MOM6 \
            .testing/build/target_codebase/.testing/build/timing/time_*
            ;;
          coverage)
            tar -cf mom6-coverage.tar \
            --exclude='.testing/build/unit/test_*.o' \
            .testing/build/cov/MOM6 \
            .testing/build/cov/*.gcno \
            .testing/build/unit/test_* \
            .testing/build/unit/*.gcno
            ;;
          *)
            echo "::error::Unknown variant '$VARIANT'"
            exit 1
            ;;
        esac

    - if: inputs.variant != 'coupled-api'
      uses: actions/upload-artifact@v4
      with:
        name: mom6-${{ inputs.variant }}-artifact
        path: mom6-${{ inputs.variant }}.tar
        retention-days: 1
