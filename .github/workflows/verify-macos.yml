name: MacOS verification

on: [push, pull_request]

env:
  CC: gcc
  FC: gfortran
  MOM_TARGET_SLUG: ${{ github.repository }}
  MOM_TARGET_LOCAL_BRANCH: ${{ github.base_ref }}
  # Build system for the build jobs below: make (the .testing Makefile) or cmake
  MOM6_BUILD_SYSTEM: make

jobs:
  # Executables
  #
  # Each build job compiles one variant with the build system named by
  # MOM6_BUILD_SYSTEM (or a fixed one where noted) and uploads it as
  # mom6-<variant>-artifact; see .github/actions/build-mom6 for the contract.

  build-symmetric:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup/

      - uses: ./.github/actions/build-mom6
        with:
          variant: symmetric
          build-system: ${{ env.MOM6_BUILD_SYSTEM }}

  build-asymmetric:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup/

      - uses: ./.github/actions/build-mom6
        with:
          variant: asymmetric
          build-system: ${{ env.MOM6_BUILD_SYSTEM }}

  build-repro:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup/

      - uses: ./.github/actions/build-mom6
        with:
          variant: repro
          build-system: ${{ env.MOM6_BUILD_SYSTEM }}

  build-openmp:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup/

      # Not yet supported by the CMake build
      - uses: ./.github/actions/build-mom6
        with:
          variant: openmp
          build-system: make

  build-target:
    if: github.event_name == 'pull_request'
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup/

      # The target codebase is built by its own .testing Makefile
      - uses: ./.github/actions/build-mom6
        with:
          variant: target
          build-system: make

  # Tests

  test-grid:
    runs-on: macOS-latest
    needs:
      - build-symmetric
      - build-asymmetric

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download symmetric MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Download asymmetric MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-asymmetric-artifact

      - name: Unpack artifacts
        run: |
          tar -xpvf mom6-symmetric.tar
          tar -xpvf mom6-asymmetric.tar

      - name: Run grid verification test
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          -o build/asymmetric/MOM6 \
          test.grid

  test-layout:
    runs-on: macOS-latest
    needs: build-symmetric

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Unpack artifacts
        run: tar -xpvf mom6-symmetric.tar

      - name: Run layout test
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          test.layout

  test-rotate:
    runs-on: macOS-latest
    needs: build-symmetric

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Unpack artifacts
        run: tar -xpvf mom6-symmetric.tar

      - name: Run rotation test
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          test.rotate

  test-restart:
    runs-on: macOS-latest
    needs: build-symmetric

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Unpack artifacts
        run: tar -xpvf mom6-symmetric.tar

      - name: Run restart test
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          test.restart

  test-nan:
    runs-on: macOS-latest
    needs: build-symmetric

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Unpack artifacts
        run: tar -xpvf mom6-symmetric.tar

      - name: Run NaN initialization test
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          test.nan

  test-dim:
    runs-on: macOS-latest
    needs: build-symmetric

    strategy:
      matrix:
        dim:
          - {id: t, desc: "time"}
          - {id: l, desc: "horizontal length"}
          - {id: h, desc: "vertical thickness"}
          - {id: z, desc: "vertical coordinate"}
          - {id: q, desc: "enthalpy"}
          - {id: r, desc: "density"}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download symmetric MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Unpack artifacts
        run: tar -xpvf mom6-symmetric.tar

      - name: Run ${{ matrix.dim.desc }} dimension test
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          test.dim.${{ matrix.dim.id }}

  test-openmp:
    runs-on: macOS-latest
    needs:
      - build-symmetric
      - build-openmp

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download symmetric MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Download OpenMP MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-openmp-artifact

      - name: Unpack artifacts
        run: |
          tar -xpvf mom6-symmetric.tar
          tar -xpvf mom6-openmp.tar

      - name: Run OpenMP test
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          -o build/openmp/MOM6 \
          test.openmp

  test-repro:
    runs-on: macOS-latest
    needs:
      - build-symmetric
      - build-repro

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download DEBUG MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Download REPRO MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-repro-artifact

      - name: Unpack artifacts
        run: |
          tar -xpvf mom6-symmetric.tar
          tar -xpvf mom6-repro.tar

      - name: Verify REPRO equivalence
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          -o build/repro/MOM6 \
          test.repro

  test-regression:
    if: github.event_name == 'pull_request'
    runs-on: macOS-latest
    needs:
      - build-symmetric
      - build-target

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup

      - name: Download symmetric MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-symmetric-artifact

      - name: Download target MOM6
        uses: actions/download-artifact@v4
        with:
          name: mom6-target-artifact

      - name: Unpack artifacts
        run: |
          tar -xpvf mom6-symmetric.tar
          tar -xpvf mom6-target.tar

      - name: Check for regressions
        run: |
          make -C .testing -j \
          -o build/symmetric/MOM6 \
          -o build/target/MOM6 \
          DO_REGRESSION_TESTS=1 \
          test.regression

  # Cleanup

  cleanup-common:
    runs-on: macOS-latest
    permissions:
      id-token: write
    needs:
      - test-grid
      - test-openmp
      - test-repro

    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            mom6-asymmetric-artifact
            mom6-openmp-artifact
            mom6-repro-artifact
            mom6-coverage-artifact

  # NOTE: There is no way to conditionally define the elements in `needs`.
  #   For now, we must create separate rules for each case.

  cleanup-push:
    if: github.event_name != 'pull_request'
    runs-on: macOS-latest
    permissions:
      id-token: write
    needs:
      - test-layout
      - test-rotate
      - test-restart
      - test-nan
      - test-dim
      - test-grid
      - test-openmp
      - test-repro

    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            mom6-symmetric-artifact
            mom6-opt-artifact

  cleanup-pr:
    if: github.event_name == 'pull_request'
    runs-on: macOS-latest
    permissions:
      id-token: write
    needs:
      - test-layout
      - test-rotate
      - test-restart
      - test-nan
      - test-dim
      - test-grid
      - test-openmp
      - test-repro
      - test-regression

    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            mom6-symmetric-artifact
            mom6-target-artifact
            mom6-opt-artifact
            mom6-opt-target-artifact
