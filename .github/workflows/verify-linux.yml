name: Linux verification

on: [push, pull_request]

jobs:
  # Documentation

  check-style-and-docstrings:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check white space (non-blocking)
      run: |
        ./.testing/trailer.py -e TEOS10 -l 120 src config_src 2>&1 | tee style_errors
      continue-on-error: true

    - name: Install packages used when generating documentation
      run: |
        sudo apt-get update
        sudo apt-get install python3-sphinx python3-lxml perl
        sudo apt-get install texlive-binaries texlive-base bibtool tex-common texlive-bibtex-extra
        sudo apt-get install graphviz

    - name: Build doxygen HTML
      run: |
        cd docs
        perl -e 'print "perl version $^V" . "\n"'
        mkdir _build && make nortd DOXYGEN_RELEASE=Release_1_8_13 UPDATEHTMLEQS=Y
        cat _build/doxygen_warn_nortd_log.txt

    - name: Report doxygen or style errors
      run: |
        grep "warning:" docs/_build/doxygen_warn_nortd_log.txt | grep -v "as part of a" | tee doxy_errors
        cat style_errors doxy_errors > all_errors
        cat all_errors
        test ! -s  all_errors

  # Build phase: every executable the tests need, uploaded as artifacts. To
  # switch build systems, point `uses:` at another producer that fulfils the
  # artifact contract in verify-linux-tests.yml.

  build:
    uses: ./.github/workflows/verify-linux-build.yml

  # Test phase: every test, timing, coverage and artifact-cleanup job.

  tests:
    # `!cancelled()` rather than the default success() check, so one failed
    # build does not skip the tests that don't use its artifact; those that do
    # fail when they download it.
    if: ${{ !cancelled() }}
    needs: build
    # A called workflow's jobs can only narrow these, so this is the union of
    # what they request: gpu-port-report reads other runs' artifacts, the
    # cleanup jobs delete this run's.
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/verify-linux-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
